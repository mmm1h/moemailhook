name: Deploy Worker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

          # 这些名字会被写入/更新为 Worker Secret（wrangler secret put）:contentReference[oaicite:7]{index=7}
          secrets: |
            BARK_ENDPOINT
            WEBHOOK_TOKEN
        env:
          # 从 GitHub Secrets 读出明文，仅在 Actions 运行时存在
          BARK_ENDPOINT: ${{ secrets.BARK_ENDPOINT }}
          WEBHOOK_TOKEN: ${{ secrets.WEBHOOK_TOKEN }}
